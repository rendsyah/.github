name: "Notify"
description: "Action to send notification"
inputs:
  channels:
    required: true
    description: "Notification channels to send the message to"
  status:
    required: true
    description: "Deployment or workflow status being reported"
  notify_url:
    required: true
    description: "API endpoint that receives the notification."
  remarks:
    required: true
    description: "Remarks to include in the notification."

runs:
  using: "composite"
  steps:
    - name: "Send Notification"
      shell: bash
      env:
        CHANNELS: ${{ inputs.channels }}
        STATUS: ${{ inputs.status }}
        REPO: ${{ github.repository }}
        REF: ${{ github.head_ref || github.ref_name }}
        ACTOR: ${{ github.actor }}
        COMMITTERS: ${{ github.event.head_commit.author.name || github.actor }}
        BUILD_NUMBER: ${{ github.run_number }}
        REMARKS: ${{ inputs.remarks }}
        NOTIFY_URL: ${{ inputs.notify_url }}
        RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        COMMIT_URL: https://github.com/${{ github.repository }}/commit/${{ github.sha }}
      run: |
        jq -n \
          --argjson channels "$CHANNELS" \
          --arg status "$STATUS" \
          --arg repo "$REPO" \
          --arg ref "$REF" \
          --arg actor "$ACTOR" \
          --arg committers "$COMMITTERS" \
          --argjson build_number "$BUILD_NUMBER" \
          --arg remarks "$REMARKS" \
          --arg run_url "$RUN_URL" \
          --arg commit_url "$COMMIT_URL" \
          '{
            channels: $channels,
            category: "operational.deployment",
            metadata: {
              source: "Github Actions",
              status: $status,
              repo: $repo,
              ref: $ref,
              actor: $actor,
              committers: $committers,
              build_number: $build_number,
              remarks: $remarks,
              run_url: $run_url,
              commit_url: $commit_url
            }
          }' | curl -fsS --max-time 5 -o /dev/null -X POST "$NOTIFY_URL" \
              -H "Content-Type: application/json" \
              -d @-
